<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>눈길 발자국 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  /* 배치: 세로 한 줄. 머리말 → 놀이 탭 → 주문 → 무대(악보 + 눈길) → 안내 → 표지판 → 실행 단추 */
  --ice:#E9EEF8;      /* 바탕: 그늘진 눈 */
  --snow:#FFFFFF;     /* 면: 새 눈 */
  --ink:#1B2145;      /* 글자, 악보, 펭귄 */
  --mist:#5F6790;     /* 보조 글자 */
  --line:#C9D2EA;     /* 테두리 */
  --print:#5B6CC4;    /* 눈 위 자국 */
  --warm:#E4572E;     /* 목도리, 고른 표지판, 쾅 */
  --ok:#147A5E;
  --no:#B23A2B;
  --display:"Bagel Fat One","Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR","Noto Sans KR",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ice);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.app{max-width:460px;min-height:100%;margin:0 auto;padding:10px 16px 10px;display:flex;flex-direction:column;gap:8px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--mist)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1.5px solid var(--line);border-radius:17px;background:var(--snow);font-size:13px;white-space:nowrap}
.chip svg{width:16px;height:16px;flex:none}
.chip[aria-pressed="false"]{color:var(--mist)}
.chip[aria-pressed="false"] .wave{display:none}
.chip[aria-pressed="true"] .mute{display:none}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--snow);border:1px solid var(--line);border-radius:14px}
.tabs button{height:34px;border:0;border-radius:10px;background:transparent;color:var(--mist);font-family:var(--display);font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}

.order{display:grid;gap:2px;align-content:start;min-height:70px;padding:8px 12px;background:var(--snow);border:1px solid var(--line);border-radius:16px}
.order-tag{font-size:12px;color:var(--mist)}
.order p{margin:0;font-size:14.5px}

.stage-wrap{background:var(--snow);border:1px solid var(--line);border-radius:18px;overflow:hidden}
#stage{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ink{fill:var(--ink)}
.staffline{stroke:var(--ink);stroke-width:.9}
.air{fill:#E3EBF8}
.snow{fill:var(--snow)}
.beat{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.print{fill:var(--print)}
.wedge{stroke:var(--print);stroke-width:1.6;stroke-linejoin:round}
.target{fill:none;stroke:var(--mist);stroke-width:1.2;stroke-dasharray:3 2.5;stroke-linejoin:round}
.ph{fill:none;stroke:var(--warm);stroke-width:1.4;stroke-dasharray:3 3;stroke-linecap:round}
.q{font-family:var(--display);font-size:14px;fill:var(--warm);text-anchor:middle}
.hit{fill:transparent;cursor:pointer}
.hit:focus-visible{outline:none;fill:rgba(228,87,46,.12)}
.badge-ok{fill:var(--ok)}
.badge-no{fill:var(--no)}
.badge-mark{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ono{font-family:var(--display);fill:var(--ink);font-size:16px}
.ono.s1{font-size:19px}
.ono.s2{font-size:23px;fill:var(--warm)}
.puff{fill:#fff;stroke:var(--line);stroke-width:.8}
.ono,.puff{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .ono{animation:pop .62s ease-out forwards}
  .puff{animation:puff .42s ease-out forwards}
  .shake{animation:shake .2s linear}
}
@media (prefers-reduced-motion:reduce){
  .ono{animation:fade .62s linear forwards}
  .puff{display:none}
}
@keyframes pop{0%{transform:scale(.4);opacity:0}22%{transform:scale(1.18);opacity:1}45%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes fade{0%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.95}100%{transform:translate(var(--dx),var(--dy)) scale(1.5);opacity:0}}
@keyframes shake{0%,100%{transform:translateY(0)}25%{transform:translateY(2.4px)}60%{transform:translateY(-1.2px)}}

.guide{display:flex;gap:7px;align-items:flex-start;min-height:40px;margin:0;font-size:13.5px}
.guide .mk{flex:none;width:18px;height:18px;margin-top:2px;border-radius:9px;display:none}
.guide.ok .mk,.guide.no .mk{display:block}
.guide.ok .mk{background:var(--ok)}
.guide.no .mk{background:var(--no)}
.guide .mk svg{display:block;width:18px;height:18px}
.guide.ok .x,.guide.no .v{display:none}

.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sign{position:relative;display:grid;grid-template-columns:26px 1fr;column-gap:6px;align-items:center;min-height:46px;padding:5px 8px;text-align:left;background:var(--snow);border:1.5px solid var(--line);border-radius:14px}
.sign svg{grid-row:1 / span 2;width:26px;height:26px}
.sign .nm{font-size:13.5px;line-height:1.2;white-space:nowrap}
.sign .on{font-family:var(--display);font-size:12.5px;line-height:1.2;color:var(--mist);white-space:nowrap}
.sign[aria-pressed="true"]{border-color:var(--warm);box-shadow:inset 0 0 0 1.5px var(--warm)}
.sign[aria-pressed="true"] .on{color:var(--warm)}
.sign.seen::after{content:"";position:absolute;bottom:7px;right:8px;width:6px;height:6px;border-radius:3px;background:var(--print)}
.sign.wrong{opacity:.45}
.sign[hidden]{display:block;visibility:hidden}
.sign:disabled{cursor:default}
@media (max-width:350px){
  .sign{grid-template-columns:22px 1fr;column-gap:4px;padding:5px 6px}
  .sign svg{width:22px;height:22px}
  .sign .nm{font-size:12.5px}
  .tabs button{font-size:13px}
}

.actions{display:flex;gap:8px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 14px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-family:var(--display);font-size:16px;white-space:nowrap}
.btn svg{width:13px;height:13px;flex:none}
.btn.ghost{flex:0 0 auto;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[hidden]{display:none}
.credit{margin:auto 0 0;font-size:11px;color:var(--mist);text-align:center}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>눈길 발자국</h1>
      <p>아티큘레이션 걸음 놀이 · 시안</p>
    </div>
    <button class="chip" id="btn-sound" type="button" aria-pressed="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h2.6L8 3v10L4.6 10H2z" fill="currentColor"/><path class="wave" d="M10.4 5.4a3.6 3.6 0 0 1 0 5.2M12.3 3.6a6.2 6.2 0 0 1 0 8.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path class="mute" d="M10.6 6l3.6 4M14.2 6l-3.6 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span id="sound-label">소리 켬</span>
    </button>
  </header>

  <nav class="tabs" role="tablist" aria-label="놀이 고르기">
    <button id="tab-learn" type="button" role="tab" aria-selected="true">걸음 배우기</button>
    <button id="tab-make" type="button" role="tab" aria-selected="false">길 만들기</button>
    <button id="tab-det" type="button" role="tab" aria-selected="false">발자국 탐정</button>
  </nav>

  <section class="order" aria-live="polite">
    <span class="order-tag" id="order-tag"></span>
    <p id="order-text"></p>
  </section>

  <div class="stage-wrap">
    <svg id="stage" viewBox="0 0 360 226" role="group" aria-label="악보와 눈길"></svg>
  </div>

  <p class="guide" id="guide" aria-live="polite">
    <span class="mk" aria-hidden="true"><svg viewBox="0 0 18 18"><path class="v" d="M5 9.4l2.6 2.6L13 6.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="x" d="M6 6l6 6M12 6l-6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></span>
    <span id="guide-text"></span>
  </p>

  <div class="tray" id="tray"></div>

  <div class="actions">
    <button class="btn" id="btn-main" type="button"></button>
    <button class="btn ghost" id="btn-sub" type="button" hidden></button>
  </div>

  <p class="credit">악보 기호 윤곽선: Bravura (SIL Open Font License 1.1)</p>
</main>

<script>

/* ───────── 치수 (SVG 좌표, 가로 360) ───────── */

const GROUND = 170, PRINT_Y = 196;     // 눈 표면, 자국의 중심선
const START_X = 56, LEAD = 0.5;        // 출발 자리, 첫 박 전의 준비 시간(초)
const T = 0.64;                        // 한 박(초)
const LEN = { none: 0.65, stac: 0.3, ten: 0.92 };   // 한 박 가운데 소리가 나는 비율
const TH = 10;                         // 보통 자국의 굵기
const PITCH = {
  F5:{s:0,f:698.46}, E5:{s:1,f:659.25}, D5:{s:2,f:587.33}, C5:{s:3,f:523.25}, B4:{s:4,f:493.88},
};
const X = i => X0 + i * W;
const HEAD_W = G.noteheadBlack.bbox[2] * SC;
const CX = i => X(i) + 10 + HEAD_W / 2;            // 음표 머리의 가운데
const yOf = p => STAFF_TOP + PITCH[p].s * SP / 2;
const ACC_Y = STAFF_TOP - 0.75 * SP;               // 악센트·마르카토의 아랫변(오선 위)

/* ───────── 표지판(기호) ───────── */
const KINDS = ['stac', 'ten', 'leg', 'acc', 'marc'];
const SIGN = {
  none:{ name:'표지판 없음', ono:'' },
  stac:{ name:'스타카토', ono:'톡', mean:'음을 짧고 또렷하게 끊어서 연주해요.', look:'자국이 점처럼 짧아요.' },
  ten: { name:'테누토',   ono:'꾹', mean:'음을 충분한 길이로 눌러 유지하며 연주해요.', look:'자국이 한 박을 꽉 채워요.' },
  leg: { name:'레가토',   ono:'스르륵', mean:'음을 부드럽게 연결하여 연주해요.', look:'자국이 끊기지 않고 이어져요.' },

};
const DET_HINT = {
  stac:'자국이 한 박보다 훨씬 짧아요. 점처럼 톡 찍혔어요.',

function specAll(kind, pitches){
  return {
    pitches,
    marks: Array(N).fill(kind === 'leg' ? 'none' : kind),
    links: Array(N - 1).fill(kind === 'leg'),
  };
}

/* ───────── 규칙: 악보 → 연주 계획 ─────────
   길이 축: 스타카토(짧게) · 표지판 없음(보통) · 테누토(끝까지) · 이음줄(다음 음까지 이어서)
   세기 축: 표지판 없음(보통) · 악센트(세게) · 마르카토(가장 세게)
   소리, 걸음, 자국이 모두 이 계획 하나에서 나온다. */
function plan(spec){
  const out = [];
  for (let i = 0; i < N; i++){
    const m = spec.marks[i];
    const linkOut = i < N - 1 && !!spec.links[i];
    const linkIn = i > 0 && !!spec.links[i - 1];
    const len = linkOut ? 1 : (m === 'stac' ? LEN.stac : m === 'ten' ? LEN.ten : LEN.none);
    const str = m === 'acc' ? 1 : m === 'marc' ? 2 : 0;
    out.push({ i, pitch: spec.pitches[i], mark: m, linkIn, linkOut, len, str });
  }
  return out;
}

/* 계획 → 눈 위 자국의 도형. 가로 = 길이, 세로 = 세기 */
function printShapes(P){
  const out = [];
  let i = 0;
  while (i < N){
    let b = i;
    while (P[b].linkOut) b++;
    const single = b === i;
    out.push({ k:'bar', x0: X(i), x1: X(b) + P[b].len * W, th: single && P[i].mark === 'stac' ? 12 : TH });
    for (let j = i; j <= b; j++){
      if (P[j].str > 0){
        const L = Math.min(LEN.none * W, j === b ? P[j].len * W : W);
        out.push({ k:'wedge', x0: X(j), x1: X(j) + L, h: P[j].str === 1 ? 11 : 17 });
        if (P[j].str === 2) out.push({ k:'specks', x: X(j) });
      }
    }
    i = b + 1;
  }
  return out;
}

/* 표지판 붙이기 규칙: 음표 머리에는 기호 하나, 이음줄 안에서는 점·줄을 쓰지 않는다 */
function applyMark(st, i, tool){
  if (st.marks[i] === tool){ st.marks[i] = 'none'; return ''; }
  st.marks[i] = tool;
  let cut = false;
  if (tool === 'stac' || tool === 'ten'){
    if (i > 0 && st.links[i - 1]){ st.links[i - 1] = false; cut = true; }
    if (i < N - 1 && st.links[i]){ st.links[i] = false; cut = true; }
  }
  return cut ? '이음줄 안에서는 점(·)과 줄(–)을 함께 쓰지 않아서 이음줄을 뗐어요.' : '';
}
function toggleLink(st, j){
  st.links[j] = !st.links[j];
  let cut = false;
  if (st.links[j]) for (const i of [j, j + 1]){
    if (st.marks[i] === 'stac' || st.marks[i] === 'ten'){ st.marks[i] = 'none'; cut = true; }
  }
  return cut ? '이음줄 안에서는 점(·)과 줄(–)을 함께 쓰지 않아서 그 기호를 뗐어요.' : '';

/* 판정: 음마다 길이 축과 세기 축을 따로 비교 */
const lenCat = n => n.linkOut ? 'leg' : (n.mark === 'stac' || n.mark === 'ten') ? n.mark : 'none';
function judge(player, target){
  const a = plan(player), b = plan(target), diffs = [];
  for (let i = 0; i < N; i++){
    const d = { i, len: lenCat(a[i]) !== lenCat(b[i]) ? lenCat(b[i]) : null, str: a[i].str !== b[i].str ? b[i].str : null };

  }
  return diffs;

const ORD = ['첫째', '둘째', '셋째', '넷째'];
function hintFor(d, level){
  const who = ORD[d.i] + ' 음';
  if (level <= 1){
    if (d.len !== null && d.str !== null) return who + '의 길이와 세기가 주문과 달라요.';
    return d.len !== null ? who + '의 길이가 주문과 달라요.' : who + '의 세기가 주문과 달라요.';
  }
  const parts = [];
  if (d.len !== null) parts.push({ stac:'짧게 끊어야 해요(스타카토 ·)', ten:'한 박을 끝까지 채워야 해요(테누토 –)', leg:'다음 음까지 이어야 해요(이음줄)', none:'보통 길이여야 해요(점·줄·이음줄 없이)' }[d.len]);

}

const markTop = (spec, i) => (spec.marks[i] === 'acc' || spec.marks[i] === 'marc') ? ACC_Y - 11.5 : yOf(spec.pitches[i]) - SP / 2;

function slurPath(spec, a, b){
  const xs = CX(a), xe = CX(b);
  const ys = markTop(spec, a) - 3.5, ye = markTop(spec, b) - 3.5;
  let apex = Math.min(ys, ye);
  for (let i = a; i <= b; i++) apex = Math.min(apex, markTop(spec, i) - 3.5);
  apex = Math.max(7, apex - 6 - (b - a) * 1.5);
  const base = (ys + ye) / 2;
  const c = base + (apex - base) / 0.75;        // 곡선의 꼭대기가 apex에 닿게 하는 조절점
  const c1 = xs + (xe - xs) * 0.25, c2 = xs + (xe - xs) * 0.75;
  return `M${r1(xs)} ${r1(ys)} C${r1(c1)} ${r1(c - 1.7)} ${r1(c2)} ${r1(c - 1.7)} ${r1(xe)} ${r1(ye)} C${r1(c2)} ${r1(c + 1.3)} ${r1(c1)} ${r1(c + 1.3)} ${r1(xs)} ${r1(ys)} Z`;
}

function drawNotes(spec, opt){

    const yc = y - (inSpace ? SP : 1.5 * SP);       // 점·줄은 음표 머리에서 가장 가까운 빈 칸의 가운데
    if (m === 'stac') L.notes.appendChild(glyphCentered('articStaccatoAbove', CX(i), yc + 42 * SC));
    else if (m === 'ten') L.notes.appendChild(glyphCentered('articTenutoAbove', CX(i), yc + 24 * SC));

    else if (m === 'marc') L.notes.appendChild(glyphCentered('articMarcatoAbove', CX(i), ACC_Y));

  if (!opt.hideMarks){
    let a = 0;

      if (!spec.links[a]){ a++; continue; }
      let b = a;
      while (b < N - 1 && spec.links[b]) b++;
      L.notes.appendChild(el('path', { d: slurPath(spec, a, b), class: 'ink' }));
      a = b;
    }
  }
  if (opt.slots){
    for (let j = 0; j < N - 1; j++){
      if (spec.links[j]) continue;
      const ys = markTop(spec, j) - 5, ye = markTop(spec, j + 1) - 5;
      L.notes.appendChild(el('path', { class: 'ph', d: `M${r1(CX(j) + 3)} ${r1(ys)} Q${r1((CX(j) + CX(j + 1)) / 2)} ${r1(Math.min(ys, ye) - 11)} ${r1(CX(j + 1) - 3)} ${r1(ye)}` }));
    }
  }
}

/* ───────── 소리 (Web Audio 합성) ─────────
   길이는 소리를 끄는 시점으로, 세기는 시작할 때의 크기와 밝기로, 이음은 소리를 끊지 않고 높이만 바꿔서 만든다. */
const MASTER = 0.85;
const ENV = [
  { peak: 0.26, sus: 0.22, att: 0.012, dec: 0.06, bright: 1700, base: 1500 },   // 보통
  { peak: 0.50, sus: 0.25, att: 0.006, dec: 0.09, bright: 3800, base: 1600 },   // 악센트
  { peak: 0.80, sus: 0.28, att: 0.004, dec: 0.11, bright: 6500, base: 1800 },   // 마르카토
];
function scheduleVoices(ctx, dest, P, t0, beat){
  const nodes = [];
  let i = 0;
  while (i < N){
    let b = i;
    while (P[b].linkOut) b++;
    const tStart = t0 + i * beat, tEnd = t0 + b * beat + P[b].len * beat;
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    o1.type = 'triangle'; o2.type = 'sawtooth';
    const g2 = ctx.createGain(); g2.gain.value = 0.16;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.6;
    const amp = ctx.createGain(); amp.gain.value = 0;
    o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(amp); amp.connect(dest);
    for (let j = i; j <= b; j++){
      const n = P[j], tj = t0 + j * beat, f = PITCH[n.pitch].f, E = ENV[n.str];
      if (j === i){
        o1.frequency.setValueAtTime(f, tj); o2.frequency.setValueAtTime(f, tj);
        amp.gain.setValueAtTime(0, tj);
        amp.gain.linearRampToValueAtTime(E.peak, tj + E.att);
        amp.gain.setTargetAtTime(E.sus, tj + E.att, E.dec);
      } else {
        const fPrev = PITCH[P[j - 1].pitch].f;
        for (const o of [o1, o2]){ o.frequency.setValueAtTime(fPrev, tj); o.frequency.exponentialRampToValueAtTime(f, tj + 0.03); }
        if (n.str > 0){
          amp.gain.setTargetAtTime(E.peak, tj, 0.006);
          amp.gain.setTargetAtTime(E.sus, tj + 0.03, E.dec);
        } else {
          amp.gain.setTargetAtTime(ENV[0].sus, tj, 0.03);
        }
      }
      lp.frequency.setValueAtTime(E.bright, tj);
      lp.frequency.setTargetAtTime(E.base, tj + 0.01, E.dec * 1.3);
    }
    amp.gain.setTargetAtTime(0, tEnd, 0.012);
    o1.start(tStart); o2.start(tStart);
    o1.stop(tEnd + 0.2); o2.stop(tEnd + 0.2);
    nodes.push({ o1, o2, amp });
    i = b + 1;
  }
  return nodes;
}

let AC = null, masterGain = null, audioWarned = false;
async function readyAudio(){
  if (!S.sound) return false;
  try {
    if (!AC){
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return false;
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      AC = new Ctor();
      masterGain = AC.createGain();
      masterGain.gain.value = MASTER;
      masterGain.connect(AC.destination);
    }
    if (AC.state !== 'running') await Promise.race([AC.resume(), new Promise(r => setTimeout(r, 300))]);
    return AC.state === 'running';
  } catch (e) { return false; }
}

/* ───────── 걷기: 소리 + 걸음 + 자국을 한 시계로 ───────── */
let walkCtl = null;
const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function stopWalk(){
  if (!walkCtl) return;
  walkCtl.dead = true;
  cancelAnimationFrame(walkCtl.raf);
  if (AC) for (const v of walkCtl.nodes){
    try { v.amp.gain.cancelScheduledValues(AC.currentTime); v.amp.gain.setTargetAtTime(0, AC.currentTime, 0.01); v.o1.stop(AC.currentTime + 0.08); v.o2.stop(AC.currentTime + 0.08); } catch (e) {}
  }
  walkCtl = null;
  wipe(L.ono); wipe(L.fx);
}

function onoFor(n){
  if (n.str === 2) return ['쾅', 's2'];
  if (n.str === 1) return ['쿵', 's1'];
  if (n.linkOut && !n.linkIn) return ['스르륵', ''];
  if (n.linkIn) return null;
  if (n.mark === 'stac') return ['톡', ''];
  if (n.mark === 'ten') return ['꾹', ''];
  return null;
}
function onset(n){
  const w = onoFor(n);
  if (w){
    const t = el('text', { x: r1(X(n.i) - 3), y: LANE_TOP + 23, class: 'ono ' + w[1] });
    t.textContent = w[0];
    t.addEventListener('animationend', () => t.remove());
    L.ono.appendChild(t);
    setTimeout(() => t.remove(), 900);
  }
  if (n.str > 0 && !reduced()){
    const count = n.str === 1 ? 3 : 6;
    for (let k = 0; k < count; k++){
      const side = k % 2 ? 1 : -1, far = 6 + 5 * Math.floor(k / 2) + (n.str === 2 ? 4 : 0);
      const c = el('circle', { cx: r1(X(n.i) + side * 4), cy: GROUND - 2, r: n.str === 2 ? 3 : 2.3, class: 'puff' });
      c.style.setProperty('--dx', (side * far) + 'px');
      c.style.setProperty('--dy', (-(7 + 3 * (k % 3)) - (n.str === 2 ? 4 : 0)) + 'px');
      c.addEventListener('animationend', () => c.remove());
      L.fx.appendChild(c);
      setTimeout(() => c.remove(), 700);
    }
    if (n.str === 2){
      L.world.classList.remove('shake');
      void L.world.getBoundingClientRect();
      L.world.classList.add('shake');
    }
  }
}

function poseAt(P, t){
  // 돌려주는 값: [x, 뜬 높이, 미끄러짐 목표, 가로 배율, 세로 배율]
  if (t < 0){
    const u = Math.max(0, 1 + t / LEAD);
    return [START_X + (X0 - START_X) * u, 12 * 4 * u * (1 - u), 0, 1, 1];
  }
  if (t >= N * T) return [X0 + N * W, 0, 0, 1, 1];
  const i = Math.floor(t / T), u = t / T - i, n = P[i];
  const x = X0 + (i + u) * W;
  if (u <= n.len){                                   // 발이 눈에 닿아 있는 동안 = 소리가 나는 동안
    const slide = (n.linkOut || n.linkIn) ? 1 : 0;
    const k = Math.min(1, (u * T) / 0.14);
    const hit = (n.linkIn && n.str === 0) ? 0 : [0.10, 0.24, 0.36][n.str] * (1 - k);
    const hold = n.mark === 'ten' ? 0.10 : 0;
    return [x, 0, slide, 1 + (hit + hold) * 0.6, 1 - hit - hold];
  }
  const v = (u - n.len) / (1 - n.len);               // 소리가 멎은 틈 = 공중에 떠 있는 동안
  const H = Math.min(20, 28 * (1 - n.len));
  return [x, H * 4 * v * (1 - v), 0, 0.97, 1.05];
}

async function startWalk(spec, onDone){
  stopWalk();
  const ctl = { dead: false, raf: 0, nodes: [] };
  walkCtl = ctl;
  const P = plan(spec);
  drawPrints(spec);
  setReveal(0);
  drawBadges(null);
  setChar(START_X, 0, 0, 1, 1);
  const audio = await readyAudio();
  if (ctl.dead) return;
  if (S.sound && !audio && !audioWarned){
    audioWarned = true;
    setGuide('이 화면에서는 소리를 낼 수 없어요. 걸음과 자국으로 확인해 주세요.', '');
  }
  let t0 = performance.now() / 1000 + LEAD + 0.06;
  if (audio){
    try {
      ctl.nodes = scheduleVoices(AC, masterGain, P, AC.currentTime + LEAD + 0.06, T);
      t0 += Math.min(0.25, AC.outputLatency || AC.baseLatency || 0);   // 스피커로 나가기까지의 지연만큼 그림을 늦춘다
    } catch (e) { ctl.nodes = []; }
  }
  const still = reduced();
  let last = -1, slide = 0;
  const frame = () => {
    if (ctl.dead) return;
    const t = performance.now() / 1000 - t0;
    const p = poseAt(P, t);
    slide += (p[2] - slide) * 0.4;
    if (still) setChar(p[0], 0, 0, 1, 1); else setChar(p[0], p[1], slide, p[3], p[4]);
    setReveal(t < 0 ? 0 : p[0] + 1);
    const k = Math.min(N - 1, Math.floor(t / T));
    if (t >= 0) while (last < k) onset(P[++last]);
    if (t > N * T + 0.4){
      setReveal(360);
      setChar(X0 + N * W, 0, 0, 1, 1);
      walkCtl = null;
      if (onDone) onDone();
      return;
    }
    ctl.raf = requestAnimationFrame(frame);
  };
  ctl.raf = requestAnimationFrame(frame);
}

/* ───────── 화면 ───────── */
function setGuide(text, kind){
  guideMsg = { text, kind: kind || '' };
  $('guide').className = 'guide' + (kind ? ' ' + kind : '');
  $('guide-text').textContent = text;
}

const ICON = {
  stac: '<circle cx="13" cy="13" r="3.1" fill="currentColor"/>',
  ten:  '<rect x="4" y="11.7" width="18" height="2.6" rx=".6" fill="currentColor"/>',
  leg:  '<path d="M3 18C8 6.5 18 6.5 23 18C18 9.6 8 9.6 3 18Z" fill="currentColor"/>',
  acc:  () => `<path d="${G.articAccentAbove.d}" transform="translate(4 19.5) scale(.0531)" fill="currentColor"/>`,
  marc: () => `<path d="${G.articMarcatoAbove.d}" transform="translate(6 20.6) scale(.06)" fill="currentColor"/>`,
  none: '<circle cx="13" cy="13" r="7.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 3"/>',
  clear:'<path d="M7 7l12 12M19 7L7 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
};
const iconSvg = k => `<svg viewBox="0 0 26 26" aria-hidden="true">${typeof ICON[k] === 'function' ? ICON[k]() : ICON[k]}</svg>`;
const PLAY = '<svg viewBox="0 0 13 13" aria-hidden="true"><path d="M2 1l10 5.5L2 12z" fill="currentColor"/></svg>';

function buildTray(){
  const tray = $('tray');
  for (const k of KINDS.concat('extra')){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sign'; b.id = 'sign-' + k;
    b.addEventListener('click', () => onSign(k));
    tray.appendChild(b);
  }
}
function fillSign(k, icon, name, sub){
  const b = $('sign-' + k);
  b.innerHTML = iconSvg(icon) + `<span class="nm">${name}</span><span class="on">${sub}</span>`;
  return b;
}

const curMission = () => MISSIONS[S.make.idx];
const playerSpec = () => ({ pitches: curMission().pitches, marks: S.make.marks, links: S.make.links });
const detKind = () => S.det.order[S.det.idx];
const detSpec = () => specAll(detKind(), DET_PITCH[S.det.idx]);
const makeOver = () => S.make.idx >= MISSIONS.length;
const detOver = () => S.det.idx >= KINDS.length;

function render(keepStage){
  const m = S.mode;
  for (const t of ['learn', 'make', 'det']) $('tab-' + t).setAttribute('aria-selected', String(t === m));
  $('btn-sound').setAttribute('aria-pressed', String(S.sound));
  $('sound-label').textContent = S.sound ? '소리 켬' : '소리 끔';

  // 표지판 칸
  for (const k of KINDS){
    const b = fillSign(k, k, SIGN[k].name, SIGN[k].ono);
    b.hidden = false; b.disabled = false;
    b.classList.remove('seen', 'wrong');
    b.setAttribute('aria-pressed', 'false');
  }
  const extra = $('sign-extra');
  extra.hidden = false; extra.disabled = false;
  extra.classList.remove('seen', 'wrong');
  extra.setAttribute('aria-pressed', 'false');

  const main = $('btn-main'), sub = $('btn-sub');
  sub.hidden = true;
  let notesSpec, notesOpt = {}, trail = null, target = null, hit = null;

  if (m === 'learn'){
    const seen = KINDS.filter(k => S.learn.seen[k]).length;
    $('order-tag').textContent = `걸음 배우기 · 만난 표지판 ${seen}/5`;
    $('order-text').textContent = '표지판을 하나씩 눌러 보세요. 같은 가락인데 걸음과 자국, 소리가 달라져요.';
    for (const k of KINDS){
      const b = $('sign-' + k);
      b.setAttribute('aria-pressed', String(S.learn.sel === k));
      if (S.learn.seen[k]) b.classList.add('seen');
    }
    fillSign('extra', 'none', '없음', '뚜벅');
    extra.setAttribute('aria-pressed', String(S.learn.sel === 'none'));
    main.innerHTML = PLAY + '<span>걷기</span>';
    notesSpec = specAll(S.learn.sel, LEARN_PITCH);
    trail = notesSpec;
    const s = SIGN[S.learn.sel];
    if (!keepStage) setGuide(S.learn.sel === 'none' ? '표지판 없음 · 보통 걸음으로 걸어요. 자국 사이에 틈이 있어요.' : `${s.name} · ${s.mean} ${s.look}`, '');
  }

  else if (m === 'make'){
    if (makeOver()){
      $('order-tag').textContent = '길 만들기 · 주문 5개 완료';
      $('order-text').textContent = '주문 다섯 개를 모두 해냈어요. 발자국 탐정에서는 자국만 보고 표지판을 맞혀 보세요.';
      for (const k of KINDS) $('sign-' + k).disabled = true;
      extra.hidden = true;
      main.innerHTML = '<span>처음부터 다시</span>';
      notesSpec = specAll('none', LEARN_PITCH);
      if (!keepStage) setGuide('', '');
    } else {
      const ms = curMission();
      $('order-tag').textContent = `주문 ${S.make.idx + 1}/${MISSIONS.length} · ${ms.kind} 주문`;
      $('order-text').textContent = ms.text;
      for (const k of KINDS) $('sign-' + k).setAttribute('aria-pressed', String(S.make.tool === k));
      fillSign('extra', 'clear', '지우기', '모두');
      if (S.make.solved){
        for (const k of KINDS) $('sign-' + k).disabled = true;
        extra.disabled = true;
        main.innerHTML = `<span>${S.make.idx === MISSIONS.length - 1 ? '마치기' : '다음 주문'}</span>`;
        sub.hidden = false; sub.innerHTML = PLAY + '<span>다시 걷기</span>';
      } else {
        main.innerHTML = PLAY + '<span>걸어 보기</span>';
        hit = S.make.tool === 'leg' ? 'link' : 'note';
        notesOpt.slots = S.make.tool === 'leg';
      }
      notesSpec = playerSpec();
      trail = S.make.walked ? notesSpec : null;
      target = ms.showTarget ? ms : null;
      if (!keepStage && !guideMsg.keep) setGuide(S.make.tool ? toolGuide(S.make.tool) : '아래에서 표지판을 고른 다음, 붙일 음을 누르세요.', '');
    }
  }

  else {
    if (detOver()){
      $('order-tag').textContent = '발자국 탐정 · 수첩';
      $('order-text').textContent = `자국 5개 가운데 ${S.det.first}개를 한 번에 맞혔어요.`;
      for (const k of KINDS) $('sign-' + k).disabled = true;
      extra.hidden = true;
      main.innerHTML = '<span>다시 하기</span>';
      notesSpec = specAll('none', LEARN_PITCH);
      if (!keepStage) setGuide('', '');
    } else {
      $('order-tag').textContent = `자국 ${S.det.idx + 1}/5`;
      $('order-text').textContent = '누가 지나갔을까요? 눈 위 자국을 보고 어떤 표지판이 있었는지 골라 보세요.';
      extra.hidden = true;
      for (const k of KINDS){
        const b = $('sign-' + k);
        if (S.det.wrong.includes(k)){ b.classList.add('wrong'); b.disabled = true; }
        if (S.det.solved){ b.disabled = true; b.setAttribute('aria-pressed', String(k === detKind())); }
      }
      notesSpec = detSpec();
      notesOpt.hideMarks = !S.det.solved;
      trail = notesSpec;
      if (S.det.solved){
        main.innerHTML = `<span>${S.det.idx === KINDS.length - 1 ? '결과 보기' : '다음 자국'}</span>`;
        sub.hidden = false; sub.innerHTML = PLAY + '<span>다시 걷기</span>';
      } else {
        main.innerHTML = PLAY + '<span>다시 걷기</span>';
      }
      if (!keepStage && !guideMsg.keep) setGuide('자국의 길이와 굵기를 보세요. 「다시 걷기」를 누르면 걸음과 소리도 나와요.', '');
    }
  }
  guideMsg.keep = false;

  drawNotes(notesSpec, notesOpt);
  drawTarget(target);
  buildHits(hit);
  if (!keepStage){
    stopWalk();
    drawPrints(trail);
    setReveal(360);
    drawBadges(m === 'make' && !makeOver() && S.make.walked ? S.make.bad : null);
    setChar(START_X, 0, 0, 1, 1);
  }
}

const toolGuide = k => k === 'leg'
  ? '이음줄을 골랐어요. 이을 두 음 사이(점선)를 누르세요. 다시 누르면 떼어져요.'
  : `${SIGN[k].name}를 골랐어요. 붙일 음을 누르세요. 다시 누르면 떼어져요.`;

function buildHits(kind){
  wipe(L.hit);
  if (!kind) return;
  const count = kind === 'link' ? N - 1 : N;
  for (let i = 0; i < count; i++){
    const x = kind === 'link' ? CX(i) : X(i) - 6;
    const label = kind === 'link' ? `${ORD[i]} 음과 ${ORD[i + 1]} 음 사이` : `${ORD[i]} 음`;
    const r = el('rect', { x: r1(x), y: 4, width: W, height: VB_H - 8, class: 'hit', tabindex: 0, role: 'button', 'aria-label': label });
    const act = () => kind === 'link' ? onLink(i) : onNote(i);
    r.addEventListener('click', act);
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); act(); } });
    L.hit.appendChild(r);
  }
}

/* ───────── 조작 ───────── */
function keepGuide(text, kind){ setGuide(text, kind); guideMsg.keep = true; }

function onSign(k){
  if (S.mode === 'learn'){
    const sel = k === 'extra' ? 'none' : k;
    S.learn.sel = sel;
    if (sel !== 'none') S.learn.seen[sel] = 1;
    render();
    startWalk(specAll(sel, LEARN_PITCH));
  } else if (S.mode === 'make'){
    if (makeOver() || S.make.solved) return;
    if (k === 'extra'){
      Object.assign(S.make, emptyMake(), { tool: S.make.tool, tries: S.make.tries });
      keepGuide('표지판을 모두 뗐어요.', '');
    } else {
      S.make.tool = S.make.tool === k ? null : k;
    }
    render();
  } else {
    if (detOver() || S.det.solved || k === 'extra') return;
    const ans = detKind();
    if (k === ans){
      if (S.det.tries === 0) S.det.first++;
      S.det.solved = true;
      keepGuide(`맞아요! ${SIGN[ans].name}. ${SIGN[ans].mean}`, 'ok');
      render();
      startWalk(detSpec());
    } else {
      S.det.tries++;
      S.det.wrong.push(k);
      if (S.det.tries >= 2){
        S.det.solved = true;
        keepGuide(`정답은 ${SIGN[ans].name}예요. ${DET_HINT[ans]}`, 'no');
        render();
        startWalk(detSpec());
      } else {
        keepGuide(`${SIGN[k].name}는 아니에요. ${DET_HINT[ans]}`, 'no');
        render();
      }
    }
  }
}

function edited(note){
  S.make.walked = false;
  S.make.bad = [];
  if (note) keepGuide(note, ''); else keepGuide(toolGuide(S.make.tool), '');
  render();
}
function onNote(i){
  if (!S.make.tool){ keepGuide('먼저 아래에서 표지판을 고르세요.', 'no'); render(true); return; }
  edited(applyMark(S.make, i, S.make.tool));
}
function onLink(j){ edited(toggleLink(S.make, j)); }

function onMain(){
  if (S.mode === 'learn'){ startWalk(specAll(S.learn.sel, LEARN_PITCH)); return; }
  if (S.mode === 'make'){
    if (makeOver()){ S.make = Object.assign({ idx: 0 }, emptyMake()); render(); return; }
    if (S.make.solved){ S.make = Object.assign({ idx: S.make.idx + 1 }, emptyMake()); render(); return; }
    const spec = playerSpec();
    setGuide('걸어 볼게요.', '');
    startWalk(spec, () => {
      const diffs = judge(spec, curMission());
      S.make.walked = true;
      S.make.bad = diffs.map(d => d.i);
      if (!diffs.length){
        S.make.solved = true;
        keepGuide('딱 맞아요! ' + curMission().win, 'ok');
      } else {
        S.make.tries++;
        const more = diffs.length > 1 ? `${diffs.length}곳이 달라요. 먼저 ` : '';
        keepGuide(more + hintFor(diffs[0], S.make.tries), 'no');
      }
      render(true);
      drawBadges(S.make.bad);
    });
    return;
  }
  if (detOver()){ S.det = newDet(); render(); return; }
  if (S.det.solved){
    S.det.idx++;
    S.det.tries = 0; S.det.solved = false; S.det.wrong = [];
    render();
    return;
  }
  startWalk(detSpec());
}
function onSub(){
  if (S.mode === 'make' && !makeOver()) startWalk(playerSpec(), () => drawBadges(S.make.bad));
  else if (S.mode === 'det' && !detOver()) startWalk(detSpec());
}

function setMode(m){
  if (S.mode === m) return;
  S.mode = m;
  guideMsg.keep = false;
  render();
}

/* ───────── 시작 ───────── */
function restore(saved){
  if (!saved || typeof saved !== 'object') return;
  try {
    if (['learn', 'make', 'det'].includes(saved.mode)) S.mode = saved.mode;
    if (typeof saved.sound === 'boolean') S.sound = saved.sound;
    if (saved.learn && SIGN[saved.learn.sel]) S.learn = { sel: saved.learn.sel, seen: Object.assign({}, saved.learn.seen) };
    const mk = saved.make;
    if (mk && Number.isInteger(mk.idx) && mk.idx >= 0 && mk.idx <= MISSIONS.length && Array.isArray(mk.marks) && mk.marks.length === N && Array.isArray(mk.links) && mk.links.length === N - 1){
      S.make = Object.assign({ idx: mk.idx }, emptyMake(), { marks: mk.marks.map(v => SIGN[v] && v !== 'leg' ? v : 'none'), links: mk.links.map(Boolean), tries: mk.tries | 0, solved: !!mk.solved });
    }
    const d = saved.det;
    if (d && Array.isArray(d.order) && d.order.length === KINDS.length && d.order.every(k => KINDS.includes(k)) && Number.isInteger(d.idx) && d.idx >= 0 && d.idx <= KINDS.length){
      S.det = { order: d.order.slice(), idx: d.idx, tries: d.tries | 0, solved: !!d.solved, first: d.first | 0, wrong: Array.isArray(d.wrong) ? d.wrong.filter(k => KINDS.includes(k)) : [] };
    }
  } catch (e) {}
}
function start(saved){
  restore(saved);
  buildStage();
  buildTray();
  $('tab-learn').addEventListener('click', () => setMode('learn'));
  $('tab-make').addEventListener('click', () => setMode('make'));
  $('tab-det').addEventListener('click', () => setMode('det'));
  $('btn-main').addEventListener('click', onMain);
  $('btn-sub').addEventListener('click', onSub);
  $('btn-sound').addEventListener('click', () => {
    S.sound = !S.sound;
    if (!S.sound) stopWalk();
    render();
  });
  render();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => JSON.parse(JSON.stringify(S)));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

/* 내 컴퓨터에서 파일로 열었을 때만 쓰는 점검용 손잡이 */
if (location.protocol === 'file:'){
  window.__snow = { S, N, T, W, LEN, MISSIONS, KINDS, plan, printShapes, judge, hintFor, applyMark, toggleLink, specAll, scheduleVoices, MASTER, render, walking: () => !!walkCtl };
}
})();
</script>
